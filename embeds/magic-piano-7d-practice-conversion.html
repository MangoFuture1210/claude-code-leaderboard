<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Piano 7D Practice Conversion Embed</title>
  <style>
    :root {
      --grid: #d8dde6;
      --text: #4f5b78;
      --muted: #7d89a6;
      --blue: #2f7dd3;
      --teal: #67c8c8;
      --gold: #f4b400;
      --bar-blue: rgba(47, 125, 211, 0.78);
      --bar-teal: rgba(103, 200, 200, 0.85);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { padding: 0; color: var(--text); }
    .frame {
      width: 100%;
      background: linear-gradient(180deg, #fcfbf8 0%, #f5f7fb 100%);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(86, 105, 145, 0.08);
    }
    .head {
      padding: 18px 20px 8px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      color: #32415f;
      font-weight: 800;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      line-height: 1.6;
    }
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 20px 10px;
    }
    .legend button {
      border: none;
      background: rgba(255,255,255,0.75);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    .legend button.off { opacity: 0.45; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .shell {
      position: relative;
      width: 100%;
      min-height: 540px;
      background: radial-gradient(circle at top, rgba(246, 248, 252, 0.98), rgba(255,255,255,0.96));
    }
    svg { width: 100%; height: 540px; display: block; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      min-width: 220px;
      background: rgba(37, 50, 77, 0.96);
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.16);
      font-size: 13px;
      line-height: 1.7;
      opacity: 0;
      z-index: 3;
    }
    .tooltip .t-date { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .foot {
      padding: 8px 20px 16px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="head">
      <div>
        <h1 class="title">魔法钢琴近一个月注册用户 7 日内练习转化率</h1>
        <div class="sub">双轴图：注册/练习用户数（柱状）+ 转化率（折线）｜ 注册日期窗口：<strong>2026-04-09 ~ 2026-05-02</strong></div>
      </div>
      <div class="meta">
        <div>DB: <strong>magic_piano</strong></div>
        <div>Updated: <strong>2026-05-09 09:36 CST</strong></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="shell" id="chartShell">
      <svg id="chart" viewBox="0 0 1360 540" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="foot">
      <div>口径：注册后 7×24 小时内，在任一练习表中出现练习记录的去重用户。</div>
      <div>可用于 iframe 嵌入</div>
    </div>
  </div>

  <script>
    const chartData = [
      { date: "2026-04-09", practiceUsers: 94, regUsers: 173, rate: 0.5434 },
      { date: "2026-04-10", practiceUsers: 121, regUsers: 223, rate: 0.5426 },
      { date: "2026-04-11", practiceUsers: 159, regUsers: 317, rate: 0.5016 },
      { date: "2026-04-12", practiceUsers: 172, regUsers: 318, rate: 0.5409 },
      { date: "2026-04-13", practiceUsers: 112, regUsers: 203, rate: 0.5517 },
      { date: "2026-04-14", practiceUsers: 97, regUsers: 173, rate: 0.5607 },
      { date: "2026-04-15", practiceUsers: 68, regUsers: 129, rate: 0.5271 },
      { date: "2026-04-16", practiceUsers: 83, regUsers: 167, rate: 0.4970 },
      { date: "2026-04-17", practiceUsers: 118, regUsers: 200, rate: 0.5900 },
      { date: "2026-04-18", practiceUsers: 194, regUsers: 334, rate: 0.5808 },
      { date: "2026-04-19", practiceUsers: 183, regUsers: 327, rate: 0.5596 },
      { date: "2026-04-20", practiceUsers: 109, regUsers: 191, rate: 0.5707 },
      { date: "2026-04-21", practiceUsers: 89, regUsers: 164, rate: 0.5427 },
      { date: "2026-04-22", practiceUsers: 81, regUsers: 162, rate: 0.5000 },
      { date: "2026-04-23", practiceUsers: 81, regUsers: 162, rate: 0.5000 },
      { date: "2026-04-24", practiceUsers: 127, regUsers: 218, rate: 0.5826 },
      { date: "2026-04-25", practiceUsers: 208, regUsers: 358, rate: 0.5810 },
      { date: "2026-04-26", practiceUsers: 181, regUsers: 314, rate: 0.5764 },
      { date: "2026-04-27", practiceUsers: 85, regUsers: 162, rate: 0.5247 },
      { date: "2026-04-28", practiceUsers: 92, regUsers: 175, rate: 0.5257 },
      { date: "2026-04-29", practiceUsers: 85, regUsers: 169, rate: 0.5030 },
      { date: "2026-04-30", practiceUsers: 120, regUsers: 222, rate: 0.5405 },
      { date: "2026-05-01", practiceUsers: 156, regUsers: 313, rate: 0.4984 },
      { date: "2026-05-02", practiceUsers: 151, regUsers: 283, rate: 0.5336 }
    ];
    const seriesState = { regUsers: true, practiceUsers: true, rate: true };
    const seriesMeta = [
      { key: "regUsers", label: "注册用户数", color: "var(--blue)" },
      { key: "practiceUsers", label: "7日内练习用户数", color: "var(--teal)" },
      { key: "rate", label: "7日内练习转化率", color: "var(--gold)" }
    ];
    const legend = document.getElementById("legend");
    seriesMeta.forEach(item => {
      const btn = document.createElement("button");
      btn.dataset.key = item.key;
      btn.innerHTML = `<span class="dot" style="background:${item.color}"></span>${item.label}`;
      btn.onclick = () => { seriesState[item.key] = !seriesState[item.key]; btn.classList.toggle("off", !seriesState[item.key]); render(); };
      legend.appendChild(btn);
    });
    const svg = document.getElementById("chart");
    const tooltip = document.getElementById("tooltip");
    const chartShell = document.getElementById("chartShell");
    const css = getComputedStyle(document.documentElement);
    function el(tag, attrs={}){ const n=document.createElementNS("http://www.w3.org/2000/svg", tag); for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v); return n; }
    function niceStep(max, ticks){ const raw=max/ticks; const power=Math.pow(10, Math.floor(Math.log10(raw||1))); const unit=raw/power; let nice=1; if(unit<=1) nice=1; else if(unit<=2) nice=2; else if(unit<=5) nice=5; else nice=10; return nice*power; }
    function fmtPct(v){ return `${(v*100).toFixed(2)}%`; }
    function render(){
      svg.innerHTML = "";
      const width=1360, height=540, margin={top:28,right:86,bottom:72,left:72}, plotW=width-margin.left-margin.right, plotH=height-margin.top-margin.bottom;
      const leftMaxSource=Math.max(...chartData.map(d=>Math.max(d.regUsers,d.practiceUsers)));
      const leftStep=niceStep(leftMaxSource*1.06,6);
      const leftMax=Math.ceil((leftMaxSource*1.08)/leftStep)*leftStep;
      const rightMax=Math.ceil((Math.max(...chartData.map(d=>d.rate))+0.03)/0.05)*0.05;
      const ticks=6, groupW=plotW/chartData.length, barW=Math.min(18, groupW*0.22);
      for(let i=0;i<=ticks;i++){
        const y=margin.top+(plotH/ticks)*i;
        svg.appendChild(el("line",{x1:margin.left,y1:y,x2:width-margin.right,y2:y,stroke:css.getPropertyValue("--grid").trim(),"stroke-width":1,"stroke-dasharray":"5 10"}));
        const ltxt=el("text",{x:margin.left-16,y:y+5,"text-anchor":"end","font-size":13,fill:"#66738f","font-weight":600}); ltxt.textContent=Math.round(leftMax-(leftMax/ticks)*i); svg.appendChild(ltxt);
        const rtxt=el("text",{x:width-margin.right+16,y:y+5,"text-anchor":"start","font-size":13,fill:"#66738f","font-weight":600}); rtxt.textContent=`${Math.round((rightMax-(rightMax/ticks)*i)*100)}%`; svg.appendChild(rtxt);
      }
      svg.appendChild(el("line",{x1:margin.left,y1:margin.top+plotH,x2:width-margin.right,y2:margin.top+plotH,stroke:"#b9c3d5","stroke-width":1.2}));
      const points=[];
      chartData.forEach((d,i)=>{
        const cx=margin.left+groupW*i+groupW/2;
        const regH=(d.regUsers/leftMax)*plotH, pracH=(d.practiceUsers/leftMax)*plotH;
        const regY=margin.top+plotH-regH, pracY=margin.top+plotH-pracH, lineY=margin.top+plotH-(d.rate/rightMax)*plotH;
        if(seriesState.regUsers) svg.appendChild(el("rect",{x:cx-barW-3,y:regY,width:barW,height:regH,rx:8,fill:css.getPropertyValue("--bar-blue").trim()}));
        if(seriesState.practiceUsers) svg.appendChild(el("rect",{x:cx+3,y:pracY,width:barW,height:pracH,rx:8,fill:css.getPropertyValue("--bar-teal").trim()}));
        points.push([cx,lineY]);
        const xt=el("text",{x:cx,y:margin.top+plotH+22,"text-anchor":"middle","font-size":12,fill:i%2===0?"#62708d":"#8b96ac","font-weight":600}); xt.textContent=d.date.slice(5); svg.appendChild(xt);
        const hit=el("rect",{x:cx-groupW/2,y:margin.top,width:groupW,height:plotH,fill:"transparent",style:"cursor:pointer"});
        hit.addEventListener("mousemove",evt=>showTooltip(evt,d));
        hit.addEventListener("mouseleave",()=>tooltip.style.opacity=0);
        svg.appendChild(hit);
      });
      if(seriesState.rate){
        svg.appendChild(el("path",{d:points.map((p,i)=>`${i===0?"M":"L"} ${p[0]} ${p[1]}`).join(" "),fill:"none",stroke:css.getPropertyValue("--gold").trim(),"stroke-width":3.5,"stroke-linecap":"round","stroke-linejoin":"round"}));
        points.forEach((p,i)=>{ const d=chartData[i]; svg.appendChild(el("circle",{cx:p[0],cy:p[1],r:5.2,fill:"#fff",stroke:css.getPropertyValue("--gold").trim(),"stroke-width":3})); const t=el("text",{x:p[0],y:p[1]-12,"text-anchor":"middle","font-size":11.5,fill:"#5f6b88","font-weight":700}); t.textContent=`${(d.rate*100).toFixed(1)}%`; svg.appendChild(t); });
      }
    }
    function showTooltip(evt,d){
      tooltip.style.opacity=1;
      tooltip.innerHTML=`<div class="t-date">${d.date}</div><div>注册用户数：<strong>${d.regUsers}</strong></div><div>7日内练习用户数：<strong>${d.practiceUsers}</strong></div><div>7日内练习转化率：<strong>${fmtPct(d.rate)}</strong></div>`;
      const rect=chartShell.getBoundingClientRect();
      tooltip.style.left=`${Math.min(evt.clientX-rect.left+12, rect.width-240)}px`;
      tooltip.style.top=`${Math.min(evt.clientY-rect.top+12, rect.height-120)}px`;
    }
    render();
    window.addEventListener("resize", render);
  </script>
</body>
</html>
